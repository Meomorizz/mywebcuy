<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeKita</title>

    <!-- Bootstrap (JANGAN DIUBAH) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container">
        <span class="navbar-brand fw-bold">☕ CafeKita</span>
    </div>
</nav>

<!-- HERO -->
<section class="hero d-flex align-items-center text-center text-light">
    <div class="container">
        <h1 class="fw-bold">Nikmati Kopi Terbaik</h1>
        <p class="lead">Suasana hangat, rasa tak terlupakan</p>
        <a href="#menu" class="btn btn-warning btn-lg">Lihat Menu</a>
    </div>
</section>

<!-- MENU -->
<section id="menu" class="container py-5">
    <h2 class="text-center mb-4">Menu Favorit</h2>

    <div id="menu-list" class="row g-4"></div>
</section>

<!-- REVIEW -->
<section class="bg-light py-5">
    <div class="container text-center">
        <h2 class="mb-4">Apa Kata Mereka?</h2>

        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <p>"Ini berlebihan!"</p>
                    <h6>- Bernadya</h6>
                </div>

                <div class="carousel-item">
                    <p>"Aku isi bensin kita ke sini lagi 😍"</p>
                    <h6>- Feast</h6>
                </div>

                <div class="carousel-item">
                    <p>"Udah 33x kesini 😍"</p>
                    <h6>- Perunggu</h6>
                </div>

            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="text-center p-3 bg-dark text-light">
    <p>© 2026 CafeKita</p>
</footer>

<!-- Bootstrap JS (JANGAN DIUBAH) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!-- JS -->
<script src="scripts.js"></script>
</body>
</html>
